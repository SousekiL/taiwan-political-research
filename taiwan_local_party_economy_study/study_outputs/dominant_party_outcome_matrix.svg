<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" role="img" aria-label="Dominant party and development outcome matrix">
<style>
        .title{font:700 30px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#111827}
