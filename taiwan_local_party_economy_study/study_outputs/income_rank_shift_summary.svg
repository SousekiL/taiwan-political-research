<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" role="img" aria-label="Income percentile-band shift summary">
<style>
        .title{font:700 30px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#111827}
        .sub{font:16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569}
        .head{font:700 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#374151}
        .label{font:14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#111827}
        .small{font:12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569}
        .grid{stroke:#d8e1ec;stroke-width:1}.axis{stroke:#94a3b8;stroke-width:2}
        </style>
<rect x="0" y="0" width="1180" height="700" fill="#fff"/>
<text x="32" y="42" class="title">Income Percentile-Band Shift, 1999 → 2024</text>
<text x="32" y="70" class="sub">所得分位段變化：Top 10% is highest household disposable income. Descriptive only; boundary changes affect comparability.</text>
<line x1="380" y1="100" x2="380" y2="620" class="axis"/>
<line x1="860" y1="100" x2="860" y2="620" class="axis"/>
<text x="380" y="88" text-anchor="middle" class="head">1999</text>
<text x="860" y="88" text-anchor="middle" class="head">2024</text>
<line x1="354" y1="100.0" x2="886" y2="100.0" class="grid"/>
<text x="342" y="104.0" text-anchor="end" class="small">Top 10%</text>
<text x="898" y="104.0" class="small">Top 10%</text>
<line x1="354" y1="157.8" x2="886" y2="157.8" class="grid"/>
<text x="342" y="161.8" text-anchor="end" class="small">10-20%</text>
<text x="898" y="161.8" class="small">10-20%</text>
<line x1="354" y1="215.6" x2="886" y2="215.6" class="grid"/>
<text x="342" y="219.6" text-anchor="end" class="small">20-30%</text>
<text x="898" y="219.6" class="small">20-30%</text>
<line x1="354" y1="273.3" x2="886" y2="273.3" class="grid"/>
<text x="342" y="277.3" text-anchor="end" class="small">30-40%</text>
<text x="898" y="277.3" class="small">30-40%</text>
<line x1="354" y1="331.1" x2="886" y2="331.1" class="grid"/>
<text x="342" y="335.1" text-anchor="end" class="small">40-50%</text>
<text x="898" y="335.1" class="small">40-50%</text>
<line x1="354" y1="388.9" x2="886" y2="388.9" class="grid"/>
<text x="342" y="392.9" text-anchor="end" class="small">50-60%</text>
<text x="898" y="392.9" class="small">50-60%</text>
<line x1="354" y1="446.7" x2="886" y2="446.7" class="grid"/>
<text x="342" y="450.7" text-anchor="end" class="small">60-70%</text>
<text x="898" y="450.7" class="small">60-70%</text>
<line x1="354" y1="504.4" x2="886" y2="504.4" class="grid"/>
<text x="342" y="508.4" text-anchor="end" class="small">70-80%</text>
<text x="898" y="508.4" class="small">70-80%</text>
<line x1="354" y1="562.2" x2="886" y2="562.2" class="grid"/>
<text x="342" y="566.2" text-anchor="end" class="small">80-90%</text>
<text x="898" y="566.2" class="small">80-90%</text>
<line x1="354" y1="620.0" x2="886" y2="620.0" class="grid"/>
<text x="342" y="624.0" text-anchor="end" class="small">90-100%</text>
<text x="898" y="624.0" class="small">90-100%</text>
<line x1="380" y1="504.4" x2="860" y2="331.1" stroke="#1f9d55" stroke-width="4" opacity=".78"/>
<circle cx="380" cy="504.4" r="5" fill="#1f9d55"/>
<circle cx="860" cy="331.1" r="5" fill="#1f9d55"/>
