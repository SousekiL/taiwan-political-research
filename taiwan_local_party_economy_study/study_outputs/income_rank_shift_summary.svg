<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" role="img" aria-label="Income rank shift summary">
<style>
        .title{font:700 30px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#111827}
        .sub{font:16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569}
        .head{font:700 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#374151}
        .label{font:14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#111827}
        .small{font:12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569}
        .grid{stroke:#d8e1ec;stroke-width:1}.axis{stroke:#94a3b8;stroke-width:2}
        </style>
<rect x="0" y="0" width="1180" height="700" fill="#fff"/>
<text x="32" y="42" class="title">Income Rank Shift, 1999 → 2024</text>
<text x="32" y="70" class="sub">所得全國排名變化：rank 1 is highest household disposable income. Downward rank number = better.</text>
<line x1="380" y1="100" x2="380" y2="620" class="axis"/>
<line x1="860" y1="100" x2="860" y2="620" class="axis"/>
<text x="380" y="88" text-anchor="middle" class="head">1999</text>
<text x="860" y="88" text-anchor="middle" class="head">2024</text>
<line x1="354" y1="100.0" x2="886" y2="100.0" class="grid"/>
<text x="342" y="104.0" text-anchor="end" class="small">#1</text>
<text x="898" y="104.0" class="small">#1</text>
<line x1="354" y1="209.5" x2="886" y2="209.5" class="grid"/>
<text x="342" y="213.5" text-anchor="end" class="small">#5</text>
<text x="898" y="213.5" class="small">#5</text>
<line x1="354" y1="346.3" x2="886" y2="346.3" class="grid"/>
<text x="342" y="350.3" text-anchor="end" class="small">#10</text>
<text x="898" y="350.3" class="small">#10</text>
<line x1="354" y1="483.2" x2="886" y2="483.2" class="grid"/>
<text x="342" y="487.2" text-anchor="end" class="small">#15</text>
<text x="898" y="487.2" class="small">#15</text>
<line x1="354" y1="620.0" x2="886" y2="620.0" class="grid"/>
<text x="342" y="624.0" text-anchor="end" class="small">#20</text>
<text x="898" y="624.0" class="small">#20</text>
<line x1="380" y1="483.2" x2="860" y2="346.3" stroke="#1f9d55" stroke-width="4" opacity=".78"/>
<circle cx="380" cy="483.2" r="5" fill="#1f9d55"/>
<circle cx="860" cy="346.3" r="5" fill="#1f9d55"/>
<text x="914" y="350.3" class="label">臺南市 ↑5</text>
<line x1="380" y1="401.1" x2="860" y2="291.6" stroke="#2563b8" stroke-width="4" opacity=".78"/>
<circle cx="380" cy="401.1" r="5" fill="#2563b8"/>
<circle cx="860" cy="291.6" r="5" fill="#2563b8"/>
<text x="914" y="295.6" class="label">苗栗縣 ↑4</text>
<line x1="380" y1="537.9" x2="860" y2="510.5" stroke="#2563b8" stroke-width="2.6" opacity=".78"/>
<circle cx="380" cy="537.9" r="5" fill="#2563b8"/>
<circle cx="860" cy="510.5" r="5" fill="#2563b8"/>
<text x="914" y="514.5" class="label">花蓮縣 ↑1</text>
<line x1="380" y1="510.5" x2="860" y2="483.2" stroke="#1f9d55" stroke-width="2.6" opacity=".78"/>
<circle cx="380" cy="510.5" r="5" fill="#1f9d55"/>
<circle cx="860" cy="483.2" r="5" fill="#1f9d55"/>
<text x="914" y="487.2" class="label">屏東縣 ↑1</text>
<line x1="380" y1="318.9" x2="860" y2="318.9" stroke="#1f9d55" stroke-width="2.6" opacity=".78"/>
<circle cx="380" cy="318.9" r="5" fill="#1f9d55"/>
<circle cx="860" cy="318.9" r="5" fill="#1f9d55"/>
<text x="914" y="322.9" class="label">高雄市 →0</text>
<line x1="380" y1="154.7" x2="860" y2="154.7" stroke="#2563b8" stroke-width="2.6" opacity=".78"/>
<circle cx="380" cy="154.7" r="5" fill="#2563b8"/>
<circle cx="860" cy="154.7" r="5" fill="#2563b8"/>
<text x="914" y="158.7" class="label">新竹縣 →0</text>
<line x1="380" y1="620.0" x2="860" y2="620.0" stroke="#2563b8" stroke-width="2.6" opacity=".78"/>
<circle cx="380" cy="620.0" r="5" fill="#2563b8"/>
<circle cx="860" cy="620.0" r="5" fill="#2563b8"/>
<text x="914" y="624.0" class="label">臺東縣 →0</text>
<line x1="380" y1="565.3" x2="860" y2="565.3" stroke="#1f9d55" stroke-width="2.6" opacity=".78"/>
<circle cx="380" cy="565.3" r="5" fill="#1f9d55"/>
<circle cx="860" cy="565.3" r="5" fill="#1f9d55"/>
<text x="914" y="569.3" class="label">嘉義縣 →0</text>
<line x1="380" y1="100.0" x2="860" y2="127.4" stroke="#2563b8" stroke-width="2.6" opacity=".78"/>
<circle cx="380" cy="100.0" r="5" fill="#2563b8"/>
<circle cx="860" cy="127.4" r="5" fill="#2563b8"/>
<text x="914" y="131.4" class="label">臺北市 ↓1</text>
<line x1="380" y1="291.6" x2="860" y2="537.9" stroke="#2563b8" stroke-width="4" opacity=".78"/>
<circle cx="380" cy="291.6" r="5" fill="#2563b8"/>
<circle cx="860" cy="537.9" r="5" fill="#2563b8"/>
<text x="914" y="541.9" class="label">南投縣 ↓9</text>
<text x="32" y="662" class="small">Color = long-term dominant local party. A line moving upward means the county/city gained national income-rank position.</text>
</svg>